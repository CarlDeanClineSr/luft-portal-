name: CLINE L1 Historical CDAWeb Smoke

on:
  push:
    branches: [rebuild-v1-clean]
    paths:
      - ".github/workflows/rebuild_v1_historical_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-v1-historical-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-rest-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout historical rebuild code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            rebuild/v1
            .github/workflows/rebuild_v1_historical_smoke.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install REST-CSV dependencies
        run: python -m pip install numpy pandas matplotlib PyYAML requests
      - name: Download paired definitive DSCOVR sample
        working-directory: rebuild/v1
        run: |
          python historical/download_dscovr_cdaweb.py \
            --start 2017-09-06T00:00:00Z \
            --end 2017-09-06T02:00:00Z \
            --warmup-hours 24 \
            --outdir validation/paired_smoke
      - name: Run frozen paired protocol
        working-directory: rebuild/v1
        run: |
          python cline_l1_chain_v1.py \
            --mag validation/paired_smoke/canonical/dscovr_mag_1m_gse.csv \
            --plasma validation/paired_smoke/canonical/dscovr_plasma_1m.csv \
            --outdir validation/paired_smoke/analysis \
            --label "CDAWeb paired smoke 2017-09-06"
      - name: Record paired summary
        working-directory: rebuild/v1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('validation/paired_smoke/download_manifest.json').read_text())
          summary = json.loads(Path('validation/paired_smoke/analysis/cline_l1_summary.json').read_text())
          result = summary['results']['all_baseline_valid']
          report = [
              '# Paired Historical CDAWeb Smoke Result', '',
              f"- Analysis protocol: `{summary['protocol']['id']}`",
              f"- Ingest protocol: `{manifest['ingest_protocol']}`",
              f"- Magnetic rows: `{manifest['magnetic']['canonical_rows']}`",
              f"- Plasma rows: `{manifest['plasma']['canonical_rows']}`",
              f"- Baseline-valid rows: `{result['n']}`",
              f"- Median chi: `{result['median']}`",
              f"- Maximum chi: `{result['max']}`",
              f"- Fraction chi > 0.15: `{result['above_0p15_fraction']}`",
              '', 'Result: **PAIRED LIVE CDAWEB SMOKE PASS**',
          ]
          Path('validation/paired_smoke/PAIRED_SMOKE_STATUS.md').write_text('\n'.join(report) + '\n')
          print('\n'.join(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cline-l1-cdaweb-paired-smoke
          path: rebuild/v1/validation/paired_smoke
          if-no-files-found: error
          retention-days: 90

  magnetic-only-rest-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout historical rebuild code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            rebuild/v1
            .github/workflows/rebuild_v1_historical_smoke.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install REST-CSV dependencies
        run: python -m pip install numpy pandas matplotlib PyYAML requests
      - name: Download magnetic-only May 2024 sample
        working-directory: rebuild/v1
        run: |
          python - <<'PY'
          from historical.download_dscovr_cdaweb import download_magnetic_only
          download_magnetic_only(
              '2024-05-10T00:00:00Z',
              '2024-05-10T02:00:00Z',
              'validation/magnetic_only_smoke',
              baseline_warmup_hours=24,
          )
          PY
      - name: Run frozen magnetic-only protocol
        working-directory: rebuild/v1
        run: |
          python cline_l1_chain_v1.py \
            --mag validation/magnetic_only_smoke/canonical/dscovr_mag_1m_gse.csv \
            --outdir validation/magnetic_only_smoke/analysis \
            --label "CDAWeb magnetic-only smoke 2024-05-10"
      - name: Record magnetic-only summary
        working-directory: rebuild/v1
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('validation/magnetic_only_smoke/download_manifest.json').read_text())
          summary = json.loads(Path('validation/magnetic_only_smoke/analysis/cline_l1_summary.json').read_text())
          result = summary['results']['all_baseline_valid']
          report = [
              '# Magnetic-Only Historical CDAWeb Smoke Result', '',
              f"- Analysis protocol: `{summary['protocol']['id']}`",
              f"- Ingest protocol: `{manifest['ingest_protocol']}`",
              f"- Magnetic rows: `{manifest['magnetic']['canonical_rows']}`",
              f"- Baseline-valid rows: `{result['n']}`",
              f"- Median chi: `{result['median']}`",
              f"- Maximum chi: `{result['max']}`",
              f"- Fraction chi > 0.15: `{result['above_0p15_fraction']}`",
              '', 'Result: **MAGNETIC-ONLY LIVE CDAWEB SMOKE PASS**',
          ]
          Path('validation/magnetic_only_smoke/MAGNETIC_ONLY_SMOKE_STATUS.md').write_text('\n'.join(report) + '\n')
          print('\n'.join(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cline-l1-cdaweb-magnetic-only-smoke
          path: rebuild/v1/validation/magnetic_only_smoke
          if-no-files-found: error
          retention-days: 90
