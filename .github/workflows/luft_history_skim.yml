name: LUFT Full-History Skim

on:
  workflow_dispatch: # Allows you to trigger this manually via the Actions tab
  schedule:
    - cron: '0 0 1 * *' # Automatically runs on the 1st of every month

jobs:
  skim-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CRITICAL: Required to read all 49k+ commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas matplotlib seaborn

      - name: Run History Skim Engine
        run: python scripts/skim_luft_history.py

      - name: Commit and Push Report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add LUFT_HISTORY_SKIM_REPORT.md commit_heatmap.png || true
          git commit -m "docs: auto-generate full history skim and heatmap" || echo "No changes to commit"
          # Pull latest changes with rebase to prevent conflicts with other bots
          git pull --rebase origin main
          git push
