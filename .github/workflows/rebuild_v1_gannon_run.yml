name: CLINE L1 — May 2024 Gannon Storm Stress Run

on:
  push:
    branches: [rebuild-v1-clean]
    paths:
      - ".github/workflows/rebuild_v1_gannon_run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cline-l1-gannon-storm-v1
  cancel-in-progress: false

jobs:
  run-gannon-storm:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout audited branch
        uses: actions/checkout@v4
        with:
          ref: rebuild-v1-clean

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rebuild/v1/requirements.txt

      - name: Install frozen ingest environment
        working-directory: rebuild/v1
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate audited source before data access
        working-directory: rebuild/v1
        run: python -m pytest -q tests

      - name: Run May 2024 storm interval
        working-directory: rebuild/v1
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          rm -rf runs/historical/gannon_storm_may_2024
          mkdir -p runs/historical
          python historical/run_epoch_batch.py \
            --run gannon_storm_may_2024 \
            --outdir runs/historical

      - name: Record immutable run provenance
        if: always()
        working-directory: rebuild/v1
        run: |
          mkdir -p runs/historical
          {
            echo "run_id=gannon_storm_may_2024"
            echo "branch=rebuild-v1-clean"
            echo "commit=${GITHUB_SHA}"
            echo "analysis_protocol=CLINE-L1-B24M-TRAIL-v1"
            echo "ingest_protocol=CDAWEB-DSCOVR-1M-MEAN-v1"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "utc_finished=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            python --version
            python -m pip freeze
          } > runs/historical/GANNON_RUN_PROVENANCE.txt
          find runs/historical -type f -maxdepth 5 -print -exec sha256sum {} \; \
            > runs/historical/GANNON_ARTIFACT_SHA256.txt || true

      - name: Upload complete run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cline-l1-gannon-storm-may-2024-${{ github.run_number }}
          path: rebuild/v1/runs/historical/
          retention-days: 60
          if-no-files-found: error
