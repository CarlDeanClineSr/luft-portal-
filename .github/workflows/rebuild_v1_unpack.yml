name: Install CLINE L1 Rebuild V1 Source

on:
  push:
    branches: [rebuild-v1-clean]
    paths:
      - "rebuild/v1/.payload_v2/**"
      - ".github/workflows/rebuild_v1_unpack.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-v1-unpack-v2
  cancel-in-progress: true

jobs:
  reconstruct-validate-commit:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout only the isolated rebuild paths
        uses: actions/checkout@v4
        with:
          ref: rebuild-v1-clean
          fetch-depth: 1
          sparse-checkout: |
            rebuild/v1
            .github/workflows/rebuild_v1_unpack.yml
          sparse-checkout-cone-mode: false

      - name: Reconstruct and verify audited source package
        shell: bash
        run: |
          set -euo pipefail
          CHUNK_DIR="rebuild/v1/.payload_v2"
          ARCHIVE="${RUNNER_TEMP}/rebuild_v1_clean_payload.tar.gz"
          EXPECTED_ARCHIVE_SHA256="ebd3db5b830276fceb01210604e5d3caf8b51009155d4c5f27217d78bd195074"

          CHUNKS=(
            "$CHUNK_DIR/chunk_00.b64part"
            "$CHUNK_DIR/chunk_01.b64part"
            "$CHUNK_DIR/chunk_02a.b64part"
            "$CHUNK_DIR/chunk_02b.b64part"
            "$CHUNK_DIR/chunk_02c.b64part"
            "$CHUNK_DIR/chunk_03.b64part"
            "$CHUNK_DIR/chunk_04.b64part"
            "$CHUNK_DIR/chunk_05.b64part"
            "$CHUNK_DIR/chunk_06.b64part"
          )
          EXPECTED_CHUNK_SHA256=(
            "332b61d0f9b44e86bb0b4be588e924595e9c9f49c5dbaa7682a80a8810d3e870"
            "0f804dcdfd880543f883babcb2052d12da6332c7e3b194447318bc5428ba2d55"
            "184ed5f6d5511117115344e63b33dddff4d98f3e29b73540060c48e04f749e63"
            "a2cc52c69c83a0ab9a37f646a48b55c39981e792af3ef0d69a46ca09c12143fe"
            "7ace9d75d8fea1fd478196c90bec637a5978610f2712069ebcfc1e32ecfb81e4"
            "f99818487c13ebf0871fac1b1d44fba6e3d1cc3466a2c5af932150f179e59929"
            "056d0f6287a43d398e8308663859bc1aa836ed229942c8d41f1994006fadea9c"
            "50b68743837d2c591b9e402a199c080d3a360701b8b455efc8fa2e30c990d15e"
            "a85d9fe643dea1e5d2c094b21a32eef815c417850044555f19a5ebe6ccbfcc52"
          )

          NORMALIZED_CHUNKS=()
          for index in "${!CHUNKS[@]}"; do
            chunk="${CHUNKS[$index]}"
            test -s "$chunk" || { echo "Missing or empty chunk: $chunk" >&2; exit 1; }
            normalized="${RUNNER_TEMP}/chunk_${index}.txt"
            tr -d '\r\n ' < "$chunk" > "$normalized"
            echo "${EXPECTED_CHUNK_SHA256[$index]}  ${normalized}" | sha256sum -c -
            echo "chunk[$index] $(basename "$chunk"): chars=$(wc -c < "$normalized")"
            NORMALIZED_CHUNKS+=("$normalized")
          done

          cat "${NORMALIZED_CHUNKS[@]}" | base64 --decode > "$ARCHIVE"
          echo "${EXPECTED_ARCHIVE_SHA256}  ${ARCHIVE}" | sha256sum -c -
          gzip -t "$ARCHIVE"
          tar -tzf "$ARCHIVE" | sed -n '1,80p'
          tar -xzf "$ARCHIVE" -C rebuild/v1

          # Remove transport-only material only after all integrity gates pass.
          rm -rf rebuild/v1/.payload_v2
          rm -rf rebuild/v1/.payload_chunks
          rm -f rebuild/v1/.payload/rebuild_v1_clean_payload.tar.gz
          rmdir rebuild/v1/.payload 2>/dev/null || true

      - name: Install core validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib pytest PyYAML requests

      - name: Run clean rebuild tests
        working-directory: rebuild/v1
        run: |
          python -m compileall -q .
          python -m pytest -q tests | tee VALIDATION_TEST_OUTPUT.txt

      - name: Record validation status
        run: |
          {
            echo "# CLINE L1 Rebuild V1 Validation"
            echo
            echo "- Source push: \`${GITHUB_SHA}\`"
            echo "- Validated UTC: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo "- Branch: \`rebuild-v1-clean\`"
            echo "- Analysis protocol: \`CLINE-L1-B24M-TRAIL-v1\`"
            echo "- Historical ingest protocol: \`CDAWEB-DSCOVR-1M-MEAN-v1\`"
            echo "- Archive SHA-256: \`ebd3db5b830276fceb01210604e5d3caf8b51009155d4c5f27217d78bd195074\`"
            echo "- Result: **PASS**"
            echo
            echo '```text'
            cat rebuild/v1/VALIDATION_TEST_OUTPUT.txt
            echo '```'
          } > rebuild/v1/VALIDATION_STATUS.md

      - name: Commit validated source tree
        run: |
          git config user.name "CLINE Rebuild Bot"
          git config user.email "cline-rebuild@users.noreply.github.com"
          git add -A rebuild/v1
          git commit -m "rebuild(v1): install checksum-verified audited source [skip ci]"
          git push origin HEAD:rebuild-v1-clean
