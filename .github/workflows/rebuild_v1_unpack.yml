name: Unpack CLINE L1 Rebuild V1

on:
  push:
    branches: [rebuild-v1-clean]
    paths:
      - "rebuild/v1/.payload/rebuild_v1_clean_payload.tar.gz"
      - ".github/workflows/rebuild_v1_unpack.yml"

permissions:
  contents: write

concurrency:
  group: rebuild-v1-unpack
  cancel-in-progress: true

jobs:
  unpack-validate-commit:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: rebuild-v1-clean
          fetch-depth: 1

      - name: Normalize and unpack audited payload
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="rebuild/v1/.payload/rebuild_v1_clean_payload.tar.gz"
          NORMALIZED="${RUNNER_TEMP}/rebuild_v1_clean_payload.tar.gz"

          if [ ! -f "$SOURCE" ]; then
            echo "Missing payload: $SOURCE" >&2
            exit 1
          fi

          # The connector may preserve base64 text rather than decoding it to
          # binary. Accept either representation, validate it, then unpack.
          if [ "$(head -c 4 "$SOURCE")" = "H4sI" ]; then
            echo "Detected base64-encoded gzip payload; decoding transport layer."
            tr -d '\r\n ' < "$SOURCE" | base64 --decode > "$NORMALIZED"
          else
            echo "Detected binary gzip payload."
            cp "$SOURCE" "$NORMALIZED"
          fi

          gzip -t "$NORMALIZED"
          tar -xzf "$NORMALIZED" -C rebuild/v1
          rm -f "$SOURCE"

      - name: Install core validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib pytest PyYAML requests

      - name: Run clean rebuild tests
        working-directory: rebuild/v1
        run: |
          python -m pytest -q tests | tee VALIDATION_TEST_OUTPUT.txt

      - name: Record validation status
        run: |
          {
            echo "# CLINE L1 Rebuild V1 Validation"
            echo
            echo "- Source push: \`${GITHUB_SHA}\`"
            echo "- Validated UTC: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo "- Branch: \`rebuild-v1-clean\`"
            echo "- Protocol: \`CLINE-L1-B24M-TRAIL-v1\`"
            echo "- Result: **PASS**"
            echo
            echo '```text'
            cat rebuild/v1/VALIDATION_TEST_OUTPUT.txt
            echo '```'
          } > rebuild/v1/VALIDATION_STATUS.md

      - name: Commit unpacked audited tree
        run: |
          git config user.name "CLINE Rebuild Bot"
          git config user.email "cline-rebuild@users.noreply.github.com"
          git add rebuild/v1
          git commit -m "rebuild(v1): unpack audited clean payload [skip ci]"
          git push origin HEAD:rebuild-v1-clean
