name: Install CLINE L1 Rebuild V1 Source

on:
  push:
    branches: [rebuild-v1-clean]
    paths:
      - "rebuild/v1/.payload_chunks/**"
      - ".github/workflows/rebuild_v1_unpack.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-v1-unpack-diagnostic-v7
  cancel-in-progress: true

jobs:
  reconstruct-validate-commit:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout only the isolated rebuild paths
        uses: actions/checkout@v4
        with:
          ref: rebuild-v1-clean
          fetch-depth: 1
          sparse-checkout: |
            rebuild/v1
            .github/workflows/rebuild_v1_unpack.yml
          sparse-checkout-cone-mode: false

      - name: Reconstruct and verify audited source package
        shell: bash
        run: |
          set -euo pipefail
          CHUNK_DIR="rebuild/v1/.payload_chunks"
          NORMALIZED="${RUNNER_TEMP}/rebuild_v1_source.tar.gz"
          EXPECTED_SHA256="a670e0140d57634ce1f3fb8dccf25b62a611122a7812183c673cdfe3ddd56c35"
          CHUNKS=(
            "$CHUNK_DIR/payload_00.b64part"
            "$CHUNK_DIR/payload_01.b64part"
            "$CHUNK_DIR/payload_02.b64part"
            "$CHUNK_DIR/payload_03.b64part"
            "$CHUNK_DIR/payload_04a.b64part"
            "$CHUNK_DIR/payload_04b.b64part"
            "$CHUNK_DIR/payload_04c.b64part"
            "$CHUNK_DIR/payload_04d.b64part"
            "$CHUNK_DIR/payload_05.b64part"
            "$CHUNK_DIR/payload_06.b64part"
            "$CHUNK_DIR/payload_07a.b64part"
            "$CHUNK_DIR/payload_07b.b64part"
          )

          for index in "${!CHUNKS[@]}"; do
            chunk="${CHUNKS[$index]}"
            test -s "$chunk" || { echo "Missing or empty chunk: $chunk" >&2; exit 1; }
            normalized_chunk="${RUNNER_TEMP}/chunk_${index}.txt"
            tr -d '\r\n ' < "$chunk" > "$normalized_chunk"
            echo "chunk[$index] $(basename "$chunk"): chars=$(wc -c < "$normalized_chunk") sha256=$(sha256sum "$normalized_chunk" | awk '{print $1}')"
          done

          cat "${CHUNKS[@]}" | tr -d '\r\n ' | base64 --decode > "$NORMALIZED"
          echo "${EXPECTED_SHA256}  ${NORMALIZED}" | sha256sum -c -
          gzip -t "$NORMALIZED"
          tar -xzf "$NORMALIZED" -C rebuild/v1

          # Remove transport-only material only after checksum and extraction pass.
          rm -rf "$CHUNK_DIR"
          rm -rf rebuild/v1/.payload_v2
          rm -f rebuild/v1/.payload/rebuild_v1_clean_payload.tar.gz
          rmdir rebuild/v1/.payload 2>/dev/null || true

      - name: Install core validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib pytest PyYAML requests

      - name: Run clean rebuild tests
        working-directory: rebuild/v1
        run: |
          python -m pytest -q tests | tee VALIDATION_TEST_OUTPUT.txt

      - name: Record validation status
        run: |
          {
            echo "# CLINE L1 Rebuild V1 Validation"
            echo
            echo "- Source push: \`${GITHUB_SHA}\`"
            echo "- Validated UTC: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo "- Branch: \`rebuild-v1-clean\`"
            echo "- Analysis protocol: \`CLINE-L1-B24M-TRAIL-v1\`"
            echo "- Historical ingest protocol: \`CDAWEB-DSCOVR-1M-MEAN-v1\`"
            echo "- Transport SHA-256: \`a670e0140d57634ce1f3fb8dccf25b62a611122a7812183c673cdfe3ddd56c35\`"
            echo "- Result: **PASS**"
            echo
            echo '```text'
            cat rebuild/v1/VALIDATION_TEST_OUTPUT.txt
            echo '```'
          } > rebuild/v1/VALIDATION_STATUS.md

      - name: Commit validated source tree
        run: |
          git config user.name "CLINE Rebuild Bot"
          git config user.email "cline-rebuild@users.noreply.github.com"
          git add -A rebuild/v1
          git commit -m "rebuild(v1): install checksum-verified audited source [skip ci]"
          git push origin HEAD:rebuild-v1-clean
