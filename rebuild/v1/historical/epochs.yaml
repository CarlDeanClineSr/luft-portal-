manifest_version: 1
canonical_protocol: CLINE-L1-B24M-TRAIL-v1
ingest_protocol: CDAWEB-DSCOVR-1M-MEAN-v1
baseline_warmup_hours: 24
sources:
  magnetic:
    dataset: DSCOVR_H0_MAG
    variables: [B1GSE, B1F1, FLAG1]
    cadence: 1 second reduced to 1-minute arithmetic means
    frame: GSE
  plasma:
    dataset: DSCOVR_H1_FC
    variables: [V_GSE, Np, THERMAL_TEMP, DQF]
    cadence: 1 minute
    frame: GSE
runs:
  gannon_storm_may_2024:
    kind: fixed
    analysis_start: "2024-05-08T00:00:00Z"
    analysis_end: "2024-05-15T00:00:00Z"
    purpose: major CME and G5 geomagnetic-storm stress interval
  quiet_solar_minimum_scan:
    kind: quiet_scan
    candidate_start: "2020-04-01T00:00:00Z"
    candidate_end: "2021-01-01T00:00:00Z"
    window_days: 30
    stride_days: 1
    minimum_coverage_fraction: 0.95
    purpose: select the quietest complete 30-day window from kinetics only
