manifest_version: 1
created_utc: "2026-08-25T00:00:00Z"
branch: rebuild-v1-clean
canonical_target:
  observable: chi_B24M
  protocol_id: CLINE-L1-B24M-TRAIL-v1
  protocol_version: 1.1.0
  baseline: prior-only trailing 24-hour median
  clipping: none
legacy_observable:
  name: legacy_composite_score_v1
  former_column_names:
    - chi_amplitude
    - chi
    - chi_capped
  known_constraints:
    - positional magnetic extraction used row element 4 where the NOAA header identifies lon_gsm
    - each density/speed/field modulation contribution was capped at 0.3
    - transformed score therefore had an intrinsic maximum of 0.155
    - final output was clipped to 0.15
policy:
  - Never auto-select a generic column named chi.
  - Never overwrite legacy files or results.
  - A rerun must record the exact observable and protocol ID.
  - Modules marked BLOCKED require a method repair before rerun.
modules:
  - path: cme_heartbeat_analysis.py
    status: PENDING_RERUN
    legacy_input: cme_heartbeat_log_2025_12.csv:chi_amplitude
    new_target: chi_B24M
    action: replace legacy response variable; preserve old figures under legacy labels
  - path: cme_hysteresis_fit.py
    status: PENDING_RERUN
    legacy_input: cme_heartbeat_log_2025_12.csv:chi_amplitude
    new_target: chi_B24M
    action: rerun with canonical row table and time-aware lag handling
  - path: scripts/validate_fractal_regulator.py
    status: PENDING_RERUN
    legacy_input: existing chi-like columns including capped heartbeat output
    new_target: chi_B24M
    action: recompute each environment from source measurements under named protocols
  - path: scripts/blind_transient_test.py
    status: PENDING_RERUN
    legacy_input: imported chi_amplitude when sourced from heartbeat logs
    new_target: chi_B24M
    action: retain kinetic split; replace response column with canonical magnetic chi
  - path: scripts/validate_causality_precursor.py
    status: BLOCKED_CIRCULAR_FALLBACK
    legacy_input: A = 3 * chi when independent anisotropy is absent
    new_target: independently measured anisotropy plus chi_B24M
    action: prohibit proxy fallback during a validation run
  - path: scripts/chi_boundary_monitor.py
    status: PENDING_RERUN
    legacy_input: universal_boundary_engine.calculate_chi with adaptive centered mean
    new_target: chi_B24M
    action: use the frozen baseline contract and retain all above-threshold values
  - path: scripts/luft_solar_wind_audit.py
    status: PENDING_RERUN
    legacy_input: centered rolling mean/global mean fallback
    new_target: chi_B24M
    action: remove fallback and delegate to canonical chain
  - path: scripts/calculate_chi_all_missions.py
    status: BLOCKED_FIXED_BASELINE
    legacy_input: fixed 5.0 nT baseline by default
    new_target: mission-specific named protocol
    action: do not pool missions until each source has a frozen baseline contract
  - path: scripts/chi_calculator.py
    status: PENDING_RERUN
    legacy_input: centered 60-row rolling mean
    new_target: chi_B24M
    action: retain as a distinct observable only if renamed; otherwise migrate
  - path: universal_boundary_engine.py
    status: REFERENCE_LEGACY_ENGINE
    legacy_input: adaptive centered mean and max of optional B/n/V perturbations
    new_target: separate named observables
    action: do not call its output chi_B24M
